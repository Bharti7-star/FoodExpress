<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Food Delivery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <a href="#" class="logo">🍔 Foodie</a>
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <div>
            <h1>Delicious Food,<br><span>Delivered Fast!</span></h1>
            <p>Order your favourite food online and enjoy every bite.</p>
            <a href="#menu" class="btn">Explore Menu</a>
        </div>
        <img
            src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=80"
            alt="Delicious pizza">
    </section>

    <section id="menu">
        <h2>Our Popular Menu</h2>

        <div class="categories">
            <button class="active" data-category="All">All</button>
            <button data-category="Pizza">Pizza</button>
            <button data-category="Burger">Burger</button>
            <button data-category="Indian">Indian</button>
            <button data-category="Drinks">Drinks</button>
        </div>

        <div class="food-grid" id="food-grid"></div>
    </section>

    <section id="cart">
        <h2>Your Shopping Cart 🛒</h2>

        <div class="cart-box">
            <div id="cart-items">Your cart is empty.</div>

            <h3>Total: ₹<span id="total">0</span></h3>

            <form id="order-form">
                <h3>Delivery Details</h3>

                <input
                    type="text"
                    id="customer-name"
                    placeholder="Full name"
                    required>

                <input
                    type="tel"
                    id="customer-phone"
                    placeholder="10-digit mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>

                <textarea
                    id="customer-address"
                    placeholder="Delivery address"
                    required></textarea>

                <button type="submit" class="btn">Place Order</button>
            </form>

            <p id="message" role="status"></p>
        </div>
    </section>

    <footer>
        <p>© 2026 Foodie | Fresh Food, Happy Mood ❤️</p>
    </footer>

</body>
</html>
